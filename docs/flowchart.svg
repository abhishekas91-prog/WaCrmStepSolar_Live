<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900">
  <style>
    .box { fill:#ffffff; stroke:#1f2937; stroke-width:2px; rx:6px; }
    .title { font: bold 16px sans-serif; fill:#111827; }
    .label { font: 13px sans-serif; fill:#111827; }
    .arrow { stroke:#111827; stroke-width:2; marker-end: url(#arrowhead); }
    .small { font: 12px sans-serif; fill:#374151; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111827" />
    </marker>
  </defs>

  <!-- Customer & Meta -->
  <rect x="40" y="40" width="220" height="70" class="box" />
  <text x="60" y="65" class="title">Customer (WhatsApp)</text>
  <text x="60" y="88" class="small">Sends message ("quotation")</text>

  <rect x="300" y="40" width="260" height="70" class="box" />
  <text x="320" y="65" class="title">Meta WhatsApp Cloud</text>
  <text x="320" y="88" class="small">Forwards webhook to /webhook</text>

  <line x1="260" y1="75" x2="300" y2="75" class="arrow" />

  <!-- Backend webhook -->
  <rect x="600" y="40" width="420" height="90" class="box" />
  <text x="620" y="65" class="title">Backend (FastAPI)</text>
  <text x="620" y="90" class="small">/webhook (verify signature, parse message)</text>

  <line x1="560" y1="75" x2="600" y2="75" class="arrow" />

  <!-- Processing flow boxes -->
  <rect x="60" y="160" width="220" height="70" class="box" />
  <text x="80" y="190" class="label">Template Rendering</text>
  <text x="80" y="208" class="small">Jinja2 invoice.html</text>

  <rect x="330" y="160" width="220" height="70" class="box" />
  <text x="350" y="190" class="label">PDF Generation</text>
  <text x="350" y="208" class="small">pdfkit / wkhtmltopdf</text>

  <rect x="600" y="160" width="220" height="70" class="box" />
  <text x="620" y="190" class="label">Supabase Storage</text>
  <text x="620" y="208" class="small">bucket: invoices (PDF object)</text>

  <rect x="860" y="160" width="220" height="70" class="box" />
  <text x="880" y="190" class="label">Supabase DB</text>
  <text x="880" y="208" class="small">table: invoices (draft row)</text>

  <!-- arrows between processing -->
  <line x1="190" y1="200" x2="330" y2="200" class="arrow" />
  <line x1="550" y1="200" x2="600" y2="200" class="arrow" />
  <line x1="820" y1="200" x2="860" y2="200" class="arrow" />

  <!-- Connect backend to Template Rendering -->
  <line x1="760" y1="85" x2="180" y2="160" class="arrow" />

  <!-- Frontend / Agent UI -->
  <rect x="60" y="300" width="420" height="90" class="box" />
  <text x="80" y="330" class="title">Frontend (CRM)</text>
  <text x="80" y="352" class="small">/invoices page — lists drafts, View PDF, Approve & Send</text>

  <line x1="860" y1="230" x2="300" y2="300" class="arrow" />

  <!-- Approve & Send flow -->
  <rect x="600" y="320" width="420" height="90" class="box" />
  <text x="620" y="350" class="title">Backend /invoices/send</text>
  <text x="620" y="372" class="small">Downloads PDF, uploads to Meta media, sends document</text>

  <line x1="480" y1="335" x2="600" y2="335" class="arrow" />

  <!-- Meta send back to Customer -->
  <line x1="1020" y1="365" x2="1060" y2="115" class="arrow" />
  <text x="1030" y="70" class="small">Document message</text>

  <line x1="1020" y1="365" x2="1020" y2="200" stroke="#111827" stroke-width="0" />

  <!-- Notes and env -->
  <rect x="60" y="440" width="1020" height="380" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="80" y="470" class="title">Notes & Environment</text>
  <text x="80" y="495" class="small">Important env vars:</text>
  <text x="360" y="495" class="small">SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, INVOICE_BUCKET</text>
  <text x="80" y="515" class="small">Meta:</text>
  <text x="360" y="515" class="small">WA_PHONE_ID, WA_TOKEN, META_APP_SECRET</text>
  <text x="80" y="535" class="small">Backend:</text>
  <text x="360" y="535" class="small">WKHTMLTOPDF_PATH, AGENT_APPROVAL_SECRET</text>
  <text x="80" y="555" class="small">Storage:</text>
  <text x="360" y="555" class="small">Supabase storage bucket 'invoices' must exist</text>
  <text x="80" y="580" class="small">DB:</text>
  <text x="360" y="580" class="small">Run migrations (001_create_invoices.sql, 002_add_invoice_payload.sql)</text>
  <text x="80" y="605" class="small">Frontend:</text>
  <text x="360" y="605" class="small">/invoices page uses signed URL route to preview PDFs securely</text>
  <text x="80" y="630" class="small">Security:</text>
  <text x="360" y="630" class="small">Keep service-role key server-side; use AGENT_APPROVAL_SECRET to protect send flow</text>

</svg>
