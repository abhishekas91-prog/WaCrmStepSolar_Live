name: wacrm-stepsolar

# Deploy stack for whatsapp.stepsolar.in.
#
# Topology (mirrors the existing Emergent ingress setup):
#   /api/*   -> proxy:8001  (FastAPI, forwards to frontend:3000)
#   all else -> frontend:3000 (Next.js standalone)
# If your reverse proxy can point everything at one upstream, you can drop
# the proxy service and route the whole domain at frontend:3000 — Next.js
# serves /api itself.
#
# Runtime secrets come from an env file (default ../frontend/.env.local).
# The only build-time inputs are NEXT_PUBLIC_* values (inlined into the
# client bundle). Use deploy/deploy.sh to drive this.

services:
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-en}
    env_file: ${ENV_FILE:-../frontend/.env.local}
    # The server always listens on 3000 inside the container. Pinned
    # here because `environment` wins over `env_file`, so a stray PORT
    # in the env file can't desync the app from the mapping below.
    environment:
      PORT: 3000
    # Host side only — FRONTEND_PORT=3000 publishes the app on :3000.
    # On a host with a reverse proxy you can leave this unpublished.
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  proxy:
    build:
      context: ../backend
    environment:
      NEXT_ORIGIN: http://frontend:3000
    ports:
      - '${PROXY_PORT:-8001}:8001'
    depends_on:
      - frontend
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/api/_proxy/health', timeout=5).status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
